name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v0.2.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            builder_args: --mac
            files: release/*/*.dmg
          - name: Windows
            os: windows-latest
            builder_args: --win
            files: release/*/*.exe
          - name: Linux
            os: ubuntu-latest
            builder_args: --linux
            files: release/*/*.deb release/*/*.AppImage

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build app
        run: npm run build
        env:
          VITE_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.VITE_PUBLIC_GITHUB_CLIENT_ID }}
          VITE_PUBLIC_GITHUB_APP_SLUG: ${{ vars.VITE_PUBLIC_GITHUB_APP_SLUG }}

      - name: Package installers
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber

