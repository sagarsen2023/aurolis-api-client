name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::package.json is at $version but the tag is ${{ github.ref_name }}. Release with npm run release."
            exit 1
          fi

      - name: Check the updater public key is set
        run: |
          if grep -q "REPLACE_WITH_THE_CONTENTS_OF_aurolis.key.pub" src-tauri/tauri.conf.json; then
            echo "::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json to your updater public key."
            exit 1
          fi

      - name: Remove stale releases for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id' \
          | while read -r id; do
              echo "Deleting stale release $id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            done

      - name: Write the release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="release-notes/${{ github.ref_name }}.md"
          if [ -f "$file" ]; then
            notes=$(cat "$file")
          else
            notes=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${{ github.ref_name }}" --jq '.body')
          fi
          printf '%s\n' "$notes" > notes.md
          {
            echo "notes<<AUROLIS_RELEASE_NOTES"
            cat notes.md
            echo "AUROLIS_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="${{ github.ref_name }}" \
            -f name="Aurolis ${{ github.ref_name }}" \
            -F body=@notes.md \
            -F draft=true -F prerelease=false \
            --jq '.id')
          echo "Created draft release $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev patchelf build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.VITE_PUBLIC_GITHUB_CLIENT_ID }}
          VITE_PUBLIC_GITHUB_APP_SLUG: ${{ vars.VITE_PUBLIC_GITHUB_APP_SLUG }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Check the installers and update manifest
        run: |
          assets=$(gh api "$RELEASE" --jq '.assets[].name')
          printf '%s\n' "$assets"
          missing=0
          for pattern in '^latest\.json$' '\.dmg$' '\.app\.tar\.gz$' '-setup\.exe$' '\.AppImage$' '\.deb$'; do
            if ! grep -Eq "$pattern" <<<"$assets"; then
              echo "::error::No asset matches $pattern"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          manifest=$(gh api "$RELEASE" --jq '.assets[] | select(.name == "latest.json") | .id')
          gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$manifest" > latest.json
          jq . latest.json
          jq -e --arg version "${GITHUB_REF_NAME#v}" '
            .version == $version and
            (.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64") and has("linux-x86_64"))
          ' latest.json > /dev/null || {
            echo "::error::latest.json is missing a platform or has the wrong version."
            exit 1
          }

      - name: Publish
        run: gh api -X PATCH "$RELEASE" -F draft=false -f make_latest=true --jq '"Published \(.html_url)"'
